spring.application.name=socialconnect

spring.datasource.url=jdbc:h2:mem:socialconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

server.port=8080

socialconnect.jwt.secret=socialconnect-lab-secret-key-2026
socialconnect.jwt.ttl-seconds=7200

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
